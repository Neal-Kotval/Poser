name: Poser
options:
  bundleIdPrefix: com.nealkotval
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: GN2A6926JU
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: '1,2'
    INFOPLIST_KEY_NSCameraUsageDescription: Poser uses the camera to scan your surroundings and guide your shot.
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Poser uses a photo you select as a reference.
    INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Poser saves photos you capture to your library.
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    GENERATE_INFOPLIST_FILE: YES
targets:
  Poser:
    type: application
    platform: iOS
    sources:
      - path: Poser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nealkotval.Poser
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PoserTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PoserTests
    dependencies:
      - target: Poser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nealkotval.PoserTests
